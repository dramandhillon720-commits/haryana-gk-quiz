workflows:
  android-apk:
    name: Haryana GK APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix missing Android folder
        script: |
          flutter create . --platforms=android --org com.haryanagk.quiz --project-name haryana_gk_quiz
      - name: Get packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
